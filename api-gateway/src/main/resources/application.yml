server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: shelf-booking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/shelves/**, /api/bookings/**, /api/shelf-groups/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    instance-id: ${spring.application.name}:${server.port}:${random.value}
    hostname: localhost
    prefer-ip-address: false