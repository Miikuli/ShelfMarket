server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/software_architecture
    username: postgres
    password: Vetv3434
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  cloud:
    discovery:
      enabled: true

    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8080  # или http://localhost:8081

jwt:
  secret: "mySuperSecretKeyThatIsAtLeast32BytesLong1234567890"
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true

# Logging для отладки
logging:
  level:
    org.springframework.security: DEBUG
    org.example.shelf_market: DEBUG
    org.springframework.web: DEBUG